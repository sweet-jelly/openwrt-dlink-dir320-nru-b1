name: Build

on:
  push:
    branches: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Env vars
        run: |
          . ./set_env
          env >> $GITHUB_ENV
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to GHCR
        id: login
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # - name: Pull image
      #   id: pull_image
      #   continue-on-error: true
      #   if: success()
      #   run: |
      #     . ./set_env
      #     docker pull ghcr.io/${{ github.repository }}/$DOCKER_IMAGE_NAME:$OPENWRT_VERSION

      - name: Set env
        run: . ./set_env

      - name: Build
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          context: .
          build-contexts: |
            scripts=./build_scripts
            openwrt=${{ env.OPENWRT_DIR }}
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.OPENWRT_VERSION }}
          build-args: |
            TOOLCHAIN_LINK=${{ env.TOOLCHAIN_LINK }}
            BUILDER_UID=${{ env.BUILDER_UID }}
            BUILDER_GID=${{ env.BUILDER_GID }}
            OPENWRT_TARGET=${{ env.OPENWRT_TARGET }}
            OPENWRT_VERSION=${{ env.OPENWRT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true


      # - name: Upload Image
      #   if: steps.build_image.outcome == 'success'
      #   continue-on-error: true
      #   run: |
      #     . ./set_env
      #     docker tag $DOCKER_IMAGE_NAME:$OPENWRT_VERSION ghcr.io/${{ github.repository }}/$DOCKER_IMAGE_NAME:$OPENWRT_VERSION
      #     docker push ghcr.io/${{ github.repository }}/$DOCKER_IMAGE_NAME:$OPENWRT_VERSION



      - name: Run build
        run: |
          . ./set_env
          ./build_scripts/run_docker_container

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OPENWRT_DIR }}/bin/targets/${{ env.OPENWRT_TARGET }}/*.bin
          tag_name: ${{ env.OPENWRT_VERSION }}-${{ env.SHA_SHORT }}

          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.CONTENT_ACCESS_SECRET }}
